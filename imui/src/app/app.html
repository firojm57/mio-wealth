@if (authService.isAuthenticated()) {
  <div class="h-screen bg-background text-text-primary transition-colors duration-300 flex flex-col overflow-hidden">
    <!-- Top Menu (Fixed, full width) -->
    <app-top-menu class="h-16 w-full flex-shrink-0 z-50 bg-card/85 backdrop-blur-md border-b border-border/10"></app-top-menu>

    <!-- Body Layout Area (Mobile-First: flex-col, changing to flex-row on Tablet/Desktop) -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden min-h-0">
      <!-- Side Menu: Hidden on Mobile, Left Vertical Column on Tablet/Desktop -->
      <app-side-menu class="w-full md:w-24 xl:w-28 flex-shrink-0 md:h-full z-40 md:z-auto"></app-side-menu>

      <!-- Main Viewport Context (Scrolls independently) -->
      <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto min-w-0 min-h-0 pb-16 md:pb-8">
        <app-content></app-content>
      </main>
    </div>
  </div>
} @else {
  <app-content></app-content>
}

<!-- Centralized Financial-Grade Toast Viewport -->
<app-toast></app-toast>
