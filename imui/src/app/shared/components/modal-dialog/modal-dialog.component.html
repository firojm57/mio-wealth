@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 animate-fade-in"
    (click)="onBackdropClick()"
    role="dialog"
    aria-modal="true"
  >
    <div
      class="bg-card border border-border rounded-3xl p-6 sm:p-7 shadow-2xl w-full flex flex-col overflow-hidden max-h-[90vh] transition-colors duration-300"
      [ngClass]="getMaxWidthClass()"
      (click)="$event.stopPropagation()"
    >
      <!-- Modal Header -->
      @if (title() || showCloseButton()) {
        <div class="flex items-center justify-between border-b border-border/40 pb-4 mb-5">
          <div>
            @if (title()) {
              <h2 class="text-lg font-bold text-text-primary tracking-tight">{{ title() }}</h2>
            }
            @if (subtitle()) {
              <p class="text-xs font-medium text-text-secondary mt-0.5">{{ subtitle() }}</p>
            }
          </div>

          <div class="flex items-center space-x-2">
            <ng-content select="[modal-header-extra]"></ng-content>

            @if (showCloseButton()) {
              <button
                type="button"
                (click)="close.emit()"
                class="p-1 rounded-full hover:bg-background text-text-secondary hover:text-text-primary cursor-pointer transition-colors"
                aria-label="Close"
              >
                <svg class="w-5 h-5"><use href="assets/icons.svg#icon-close"></use></svg>
              </button>
            }
          </div>
        </div>
      }

      <!-- Modal Body -->
      <div class="overflow-y-auto flex-1 space-y-4 pr-1">
        <ng-content select="[modal-body]"></ng-content>
        <ng-content></ng-content>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end space-x-3 pt-4 border-t border-border/40 mt-5 empty:hidden">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
