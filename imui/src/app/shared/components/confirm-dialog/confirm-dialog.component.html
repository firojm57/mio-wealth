<app-modal-dialog
  [isOpen]="isOpen()"
  [title]="title()"
  maxWidth="md"
  (close)="cancel.emit()"
>
  <div modal-body class="flex items-start space-x-4 pt-1">
    <div [ngClass]="getToneIconContainerClass()" class="shrink-0">
      @if (tone() === 'danger') {
        <svg class="w-5 h-5"><use href="assets/icons.svg#icon-trash"></use></svg>
      } @else if (tone() === 'warning') {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      } @else {
        <svg class="w-5 h-5"><use href="assets/icons.svg#icon-investments"></use></svg>
      }
    </div>

    <div class="space-y-1.5 flex-1">
      <p class="text-sm font-medium text-text-secondary leading-relaxed">{{ message() }}</p>
      <ng-content select="[confirm-extra]"></ng-content>
    </div>
  </div>

  <div modal-footer class="flex items-center justify-end space-x-3 w-full">
    <button
      type="button"
      (click)="cancel.emit()"
      [disabled]="isSubmitting()"
      class="px-5 py-2 rounded-full font-medium text-xs text-text-primary bg-card hover:bg-background border border-border shadow-sm cursor-pointer transition-colors duration-300 disabled:opacity-50"
    >
      {{ cancelText() }}
    </button>
    <button
      type="button"
      (click)="confirm.emit()"
      [disabled]="isSubmitting()"
      [ngClass]="getConfirmButtonClass()"
      class="flex items-center space-x-1.5"
    >
      @if (isSubmitting()) {
        <svg class="w-4 h-4 animate-spin mr-1" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      }
      <span>{{ confirmText() }}</span>
    </button>
  </div>
</app-modal-dialog>
