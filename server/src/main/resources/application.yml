server:
  port: ${PORT:8080}

spring:
  application:
    name: mio-wealth-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:investmanDB}?currentSchema=${DB_SCHEMA:public}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration/shared

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d3e7b1a5f6c8d2e4b7a9c1d3f5e7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  file:
    name: ${LOG_FILE:logs/mio-wealth.log}
    path: ${LOG_PATH:logs}
  level:
    root: INFO
    com.greenboard.investman: ${LOG_LEVEL:DEBUG}
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:INFO}
